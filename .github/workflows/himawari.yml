name: Himawari-9 Cloud Tile Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force reprocess even if recent tile exists"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  process:
    name: Download → Reproject → Tile → Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Skip if manifest < 25 min old ──────────────────────────────────────
      - name: Check manifest freshness
        id: freshness
        if: ${{ !inputs.force }}
        run: |
          node - <<'EOF'
          const url = "https://cdn.jsdelivr.net/gh/SushantChalise/weather-data-mirror@data-mirror/himawari/latest/manifest.json";
          fetch(url, { cache: "no-store" })
            .then(r => r.ok ? r.json() : null)
            .then(m => {
              if (!m?.generated_at) { console.log("No manifest — proceeding"); return; }
              const ageMin = (Date.now() - new Date(m.generated_at).getTime()) / 60000;
              if (ageMin < 25) {
                console.log(`Manifest is ${ageMin.toFixed(0)} min old — skipping`);
                require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
              } else {
                console.log(`Manifest is ${ageMin.toFixed(0)} min old — proceeding`);
              }
            })
            .catch(e => console.log(`Freshness check failed (${e.message}) — proceeding`));
          EOF

      # ── Python: satellite science ───────────────────────────────────────────
      - name: Set up Python 3.11
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-himawari-pip-${{ hashFiles('scripts/ingestion/himawari/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-himawari-pip-

      - name: Install Python dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pip install -r scripts/ingestion/himawari/requirements.txt

      - name: Generate Himawari tiles (Python)
        if: steps.freshness.outputs.skip != 'true'
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: python scripts/ingestion/himawari/pipeline.py

      # ── Node.js: commit-and-push to weather-data-mirror ───────────────────
      - name: Install Node dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Upload tiles to weather-data-mirror (Node.js)
        if: steps.freshness.outputs.skip != 'true'
        env:
          WEATHER_DATA_MIRROR_TOKEN: ${{ secrets.WEATHER_DATA_MIRROR_TOKEN }}
        run: node scripts/ingestion/himawari/upload.mjs

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.freshness.outputs.skip }}" = "true" ]; then
            echo "Skipped — manifest is fresh"
          else
            echo "Pipeline complete"
          fi
