materials:
  - id: "MAT_IceClean"
    bpy_name: "wc_ice_clean"
    used_on:
      - "Glacier_Clean_HKH"
      - "Khumbu_Icefall"
      - "Yala_Glacier"
      - "Imja_IceCliff_Full"
      - "Imja_IceCliff_PostCalving"
      - "Calving_Block"
    base_color: "#7DD3FC"
    classification: "ARTISTIC"  # ice grammar color is the locked atlas palette
    notes: "Clean blue-white glacier ice; SSS for translucency."

  - id: "MAT_IceDebris"
    bpy_name: "wc_ice_debris"
    used_on:
      - "Glacier_Debris_Nepal"
      - "Imja_Glacier_Tongue"
    base_color_range: ["#6A6058", "#7A6E60"]
    classification: "ARTISTIC"
    notes: "Grey-brown debris-covered glacier. Supraglacial pond color #7EC8C0 mixed in via noise."

  - id: "MAT_LakeWater"
    bpy_name: "wc_lake_imja"
    used_on:
      - "ImjaTsho_2020"
      - "SuperglacialPonds"
    base_color: "#78C8C0"
    classification: "SCHEMATIC"
    physics_note: "Volumetric Tyndall scattering approximation of glacial flour (2–65 micron) in colloidal suspension. Surface alpha capped at 0.85."

  - id: "MAT_Terrain"
    bpy_name: "wc_terrain"
    used_on:
      - "HKH_DEM_orbital"
      - "Nepal_DEM_regional"
      - "Langtang_DEM"
      - "Kangchenjunga_DEM"
      - "Imja_Basin_DEM"
    base_color: "#475569"  # mid-range slate (height ramp)
    classification: "DATA-LOCKED"
    notes: "Height ramp: #7A6B5A (plains) → #475569 (mid) → #94A3B8 (upper rock) → #E0F2FE (summit snow)."

  - id: "MAT_MoraineDam"
    bpy_name: "wc_moraine_dam"
    used_on:
      - "MoraineDam_Detail"
      - "SubsidenceHollow"
    base_color: "#7E7668"
    classification: "SCHEMATIC"
    notes: "Loose unconsolidated glacial till. Flat-shaded. SubsidenceHollow uses Roughness 0.98."

data_classification:
  data_locked:
    - "HKH_DEM (Copernicus GLO-30 / SRTM 90m + 30m)"
    - "Glacier_1990_HKH (ICIMOD HKH Glacier Inventory 1990)"
    - "Glacier_2020_HKH (ICIMOD HKH Glacier Inventory 2020)"
    - "Khumbu_Glacier_polygon (RGI 7.0)"
    - "Village_locations (OSM)"
    - "Vegetation_altitude_bands (ESA WorldCover + Research Brief §1 Zone 1 table)"
    - "Imja_Glacier_1962_outline (Somos-Valenzuela et al. 2014, digitized Fig. 2)"
    - "ImjaTsho_1992_outline (Somos-Valenzuela et al. 2014)"
    - "ImjaTsho_2010_outline (ICIMOD HKH Glacial Lake Inventory 2010)"
  schematic:
    - "Imja_Lake_2020_polygon (constructed from Research Brief coordinates and 1.56 km² area; NOT the measured 2020 outline)"
    - "Imja_Lake_1962_pond_overlay (artistic approximation of pre-lake supraglacial pond cluster; NOT digitized from Corona imagery)"
    - "Imja_Glacier_terminus_2020 (approximated from research-brief description; NOT measured)"
    - "Moraine_Dam_geometry (40–50m height per Research Brief §2; exact 3D form is schematic)"
    - "SubsidenceHollow_mesh (visual interpretation of Brencher 2026 InSAR-documented dead-ice subsidence; surface bowl is inferred, not photographed)"
  artistic:
    - "All atmospheric haze, alpenglow, clouds, mist"
    - "All camera movements, focal lengths, light direction"
    - "Sound design (which is: NONE — silent throughout)"
    - "Ice texture detail within scientifically valid bounds (Research Brief §5)"
    - "Calving particle simulation (constrained: block ≤ 2.5 m³, wave ≤ 15 cm)"
    - "Prayer flag (Shot 13 — incidental human-presence detail)"

poster_frame_definition:
  frame: 841
  frame_1_indexed: 841
  frame_0_indexed: 840
  shot_id: 13
  reason: "First frame of Shot 13 (Moraine Dam Final Hold). The moraine dam in tight 85mm framing. Imja Tsho #78C8C0 in upper background. Fade-to-black has not yet started (begins f891)."
  alternate_note: "Some older docs reference frame 856 (the pre-redistribution Shot 14 start). After BLOCKING FIX #5 frame redistribution, Shot 13 final hold begins at f841, not f856. The canonical poster frame follows the redistributed schedule."

acceptance_tests:
  consistency_checks:
    - description: "No Annapurna references in canonical docs"
      command: "grep -RE 'SHOT 0?5.*Annapurna|Annapurna_DEM|Annapurna Sanctuary' docs/water-cycle/storyboards/ --exclude-dir=archive"
      expect: "no matches"
    - description: "No Shot 14 references in canonical docs"
      command: "grep -RE 'Shot 14|SHOT 14' docs/water-cycle/storyboards/ --exclude-dir=archive"
      expect: "no matches (only references to '900-frame total' permitted)"
    - description: "No Bhushan references outside archive"
      command: "grep -RE 'Bhushan' docs/water-cycle/storyboards/ --exclude-dir=archive"
      expect: "no matches"
    - description: "No pixel-equality test in tech-spec"
      command: "grep -RE 'pixel.*equal|center.pixel' docs/water-cycle/storyboards/ --exclude-dir=archive"
      expect: "no matches in technical-spec.md (replaced with masked-region median)"

  color_gate:
    layer: "exr_source"
    method: "masked_region_median"
    target_hex: "#78C8C0"
    tolerance_delta_e: 5
    delta_e_method: "CIE ΔE2000"
    mask_source: "ImjaTsho_2020 object render pass"
    stages:
      - stage: "exr_source"
        method: "masked_region_median"
        target: "#78C8C0"
        tolerance: "ΔE ≤ 5"
      - stage: "poster_jpg"
        method: "visual_diff_vs_expected"
        target: "expected/poster-frame-841.jpg"
        tolerance: "mean ΔE ≤ 8"
      - stage: "encoded_webm_mp4"
        method: "visual_qa_only"
        tolerance: "no automated pixel test (Mother review)"

  determinism:
    method: "sha256(cinematic.webm) on two successive renders with identical seed.py state"

  provenance_validation:
    command: "npm run validate:water-cycle-provenance ch0"
    expect: "exit code 0"

